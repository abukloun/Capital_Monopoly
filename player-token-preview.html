<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital — Player Token Preview</title>
<style>
:root{color-scheme:dark;--bg:#100d1b;--line:#413963;--muted:#aaa5c1}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:40px 24px;background:radial-gradient(ellipse at 50% 0%,#282248 0%,#151122 48%,var(--bg) 100%);font:500 15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f7f5ff}main{width:min(900px,100%);margin:0 auto}header{margin:0 0 24px}h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.04em}header p{margin:8px 0 0;color:var(--muted)}.stage{padding:clamp(18px,4vw,34px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(47,40,78,.9),rgba(23,20,40,.94));box-shadow:0 22px 70px #05040a99}.tokens{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:18px}.sample{min-height:154px;display:grid;place-items:center;align-content:center;gap:15px;border:1px solid #ffffff12;border-radius:16px;background:linear-gradient(150deg,#ffffff0b,#ffffff03)}.name{font-size:12px;font-weight:700;color:#c9c3dc;letter-spacing:.04em}.token{--c:#8052dc;position:relative;width:82px;height:82px;border-radius:50%;isolation:isolate;background:radial-gradient(circle at 31% 24%,color-mix(in srgb,var(--c) 55%,#fff) 0%,var(--c) 51%,color-mix(in srgb,var(--c) 74%,#17132a) 100%);box-shadow:inset -7px -9px 14px #09071335,inset 3px 4px 9px #ffffff40,0 8px 16px #05040b66}.eye{position:absolute;right:7px;width:24px;height:27px;border-radius:50%;background:radial-gradient(ellipse at 40% 34%,#fff 0 62%,#e1e2ea 100%);box-shadow:0 2px 4px #17132655,inset 0 0 0 1px #ffffffa6}.eye.one{top:12px}.eye.two{top:43px}.eye i{position:absolute;top:7px;left:12px;width:8px;height:9px;border-radius:50%;background:#12111b;box-shadow:1px 1px 0 #555}.eye i:after{content:"";position:absolute;top:1px;left:1px;width:2px;height:2px;border-radius:50%;background:#fff}.cyan{--c:#3ad1c4}.purple{--c:#b877e0}.lime{--c:#c7d63f}.gold{--c:#e7b34c}.coral{--c:#e05c5c}.blue{--c:#4ca6e7}.pink{--c:#4caf7d}.orange{--c:#e0904c}footer{margin-top:20px;color:#8d87a7;font-size:12px;text-align:center}@media(max-width:560px){body{padding:24px 14px}.tokens{grid-template-columns:repeat(2,minmax(120px,1fr));gap:12px}.sample{min-height:142px}}
</style></head>
<body><main><header><h1>Player tokens</h1><p>Eight colour variants in the game's player palette — the same character is used on the board.</p></header><section class="stage" aria-label="Eight player token previews"><div class="tokens">
<article class="sample"><div class="token cyan" role="img" aria-label="Teal character token"><span class="eye one"><i></i></span><span class="eye two"><i></i></span></div><span class="name">TEAL</span></article>
<article class="sample"><div class="token purple" role="img" aria-label="Purple character token"><span class="eye one"><i></i></span><span class="eye two"><i></i></span></div><span class="name">PURPLE</span></article>
<article class="sample"><div class="token lime" role="img" aria-label="Lime character token"><span class="eye one"><i></i></span><span class="eye two"><i></i></span></div><span class="name">LIME</span></article>
<article class="sample"><div class="token gold" role="img" aria-label="Gold character token"><span class="eye one"><i></i></span><span class="eye two"><i></i></span></div><span class="name">GOLD</span></article>
<article class="sample"><div class="token coral" role="img" aria-label="Red character token"><span class="eye one"><i></i></span><span class="eye two"><i></i></span></div><span class="name">RED</span></article>
<article class="sample"><div class="token blue" role="img" aria-label="Blue character token"><span class="eye one"><i></i></span><span class="eye two"><i></i></span></div><span class="name">BLUE</span></article>
<article class="sample"><div class="token pink" role="img" aria-label="Green character token"><span class="eye one"><i></i></span><span class="eye two"><i></i></span></div><span class="name">GREEN</span></article>
<article class="sample"><div class="token orange" role="img" aria-label="Orange character token"><span class="eye one"><i></i></span><span class="eye two"><i></i></span></div><span class="name">ORANGE</span></article>
</div></section><footer>Standalone preview only · not connected to the game</footer></main></body></html>
