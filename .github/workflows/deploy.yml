name: Deploy game to GitHub Pages

# The game lives in html_version/ so the repository root can hold the README,
# the licence and the deploy config without the game swallowing them.
# GitHub Pages can only publish from the repository root or from /docs, so the
# site is assembled from html_version/ and uploaded from the workflow instead of
# moving files around.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; cancel the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          # The game resolves audio/ relative to index.html, so audio/ has to
          # land next to index.html in the published root.
          cp -R html_version/. _site/
          test -f _site/index.html
          test -f _site/audio/capital-theme.mp3

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
